name: Research release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== "v" + p.version) throw Error("Release tag differs from package version");'
      - uses: actions/download-artifact@v4
        with:
          name: research-package
          path: release
      - name: Publish verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "Research $RELEASE_TAG" --notes "Optional Research package. See the repository README and contracts/host-fixture.json for the verified Cave host revision."
